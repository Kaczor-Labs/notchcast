# Keep main = upstream main + our commits, and mirror upstream releases. See notchcast/README.md.
name: Sync

on:
  schedule:
    - cron: "7-59/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - Tinycast.xcodeproj/project.pbxproj
      - Tinycast.xcodeproj/xcshareddata/xcschemes/Tinycast.xcscheme
      - Tinycast/Resources/RaycastRuntime.generated.js
      - README.md

permissions:
  contents: read

# One run at a time; kick skips queued runs, which read current upstream and main when they start.
# Pushes can still replace a pending run; plan tests any main without a green `notchcast/tested` status.
concurrency:
  group: sync
  cancel-in-progress: false

env:
  FORK_SSH: git@github.com:${{ github.repository }}.git

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Also replays our commits here, on Linux: a conflict is reported (issue notchcast-sync) without a macOS runner.
    # Reads the keeper's review of new upstream before running its tree: no review, no rebase.
    # actions: read and statuses: write let it skip testing a main that a green PR build already tested (reuse_pr_build).
    permissions:
      contents: read
      actions: read
      statuses: write
      pull-requests: read
      issues: write
    outputs:
      rebase: ${{ steps.plan.outputs.rebase }}
      test_main: ${{ steps.plan.outputs.test_main }}
      main: ${{ steps.plan.outputs.main }}
      base: ${{ steps.plan.outputs.base }}
      upstream_main: ${{ steps.plan.outputs.upstream_main }}
      main_key: ${{ steps.plan.outputs.main_key }}
      releases: ${{ steps.plan.outputs.releases }}
      stage: ${{ steps.plan.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 notchcast/ci.py plan

  # Upstream moved and is not reviewed yet: push its diff to sync/upstream and open or update the review PR (open),
  # or close that PR once main holds upstream (close). Runs no upstream code; the deploy key can set no status.
  stage:
    needs: plan
    if: needs.plan.outputs.stage != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sync
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./notchcast/actions/deploy-key
        if: needs.plan.outputs.stage == 'open'
        with:
          key: ${{ secrets.DEPLOY_KEY }}
      - name: Stage the upstream diff for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 notchcast/ci.py stage "${{ needs.plan.outputs.stage }}" "${{ needs.plan.outputs.base }}" "${{ needs.plan.outputs.upstream_main }}"
      - name: Drop the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key"

  # Upstream moved and its review passed: replay our commits onto it and commit that tree as a merge of main and
  # upstream, so main only gains a commit; build and test. Nothing to replay but main not
  # tested yet (a push): build and test main as it is, once. The tree's code runs here, so no secret and no write token.
  # Issues: kind sync for a replay onto new upstream (cause stable across upstream commits), main for main as it is.
  main:
    name: ${{ needs.plan.outputs.rebase == 'true' && 'replay' || 'main' }}
    needs: plan
    if: needs.plan.outputs.rebase == 'true' || needs.plan.outputs.test_main == 'true'
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
      statuses: read
    outputs:
      head: ${{ steps.replay.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          path: src
          fetch-depth: 0
          persist-credentials: false
      # Plan read it up to an hour ago; nothing of upstream runs unless it is still a success.
      - name: Re-read the upstream review
        if: needs.plan.outputs.rebase == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/notchcast/ci.py reviewed "${{ needs.plan.outputs.upstream_main }}"
      - uses: ./tools/notchcast/actions/xcode
      - uses: ./tools/notchcast/actions/xcodegen
      # Its head output is fixed before the build and tests run; the push job pushes exactly that commit.
      - name: Replay our commits onto upstream main
        id: replay
        if: needs.plan.outputs.rebase == 'true'
        working-directory: src
        env:
          UP: ${{ needs.plan.outputs.upstream_main }}
        run: |
          source ../tools/notchcast/config.env
          bash ../tools/notchcast/fetch-upstream.sh
          test "$(git rev-parse refs/remotes/upstream/main)" = "$UP" || git fetch -q "https://github.com/$UPSTREAM_REPO.git" "$UP"
          python3 ../tools/notchcast/ci.py replay . "$UP"
          python3 ../tools/notchcast/ci.py merge . "${{ needs.plan.outputs.main }}" "$UP"
          mkdir -p "$RUNNER_TEMP/replayed"
          git bundle create "$RUNNER_TEMP/replayed/replayed.bundle" HEAD "^$UP"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: needs.plan.outputs.rebase == 'true'
        with:
          name: replayed
          path: ${{ runner.temp }}/replayed
          if-no-files-found: error
          retention-days: 1
      - name: Regenerate project before building main
        working-directory: src
        run: '"$XCODEGEN" generate --quiet'
      - name: Build (Debug, unsigned)
        working-directory: src
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build -quiet
      # No lint here on purpose: replayed commits passed PR lint, and upstream's own rules (check-migrations after a
      # stable tag) must never stop main moving onto upstream.
      - uses: ./tools/notchcast/actions/tests
        with:
          # A harness that also fails on this upstream commit is not ours.
          upstream: ${{ needs.plan.outputs.rebase == 'true' && needs.plan.outputs.upstream_main || needs.plan.outputs.base }}

  # Runs none of the tree's code. After a replay: fetch exactly the commit the main job reported, re-read the review,
  # and only then take the deploy key and move main. Either way the tested commit gets a green `notchcast/tested` status.
  push:
    name: ${{ needs.plan.outputs.rebase == 'true' && 'replay push' || 'main tested' }}
    needs: [plan, main]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: sync
    permissions:
      contents: read
      statuses: write
      issues: write
    outputs:
      lost: ${{ steps.review.outputs.lost || steps.update.outputs.lost }}
    env:
      REBASE: ${{ needs.plan.outputs.rebase }}
      OLD: ${{ needs.plan.outputs.main }}
      UP: ${{ needs.plan.outputs.upstream_main }}
      HEAD_SHA: ${{ needs.plan.outputs.rebase == 'true' && needs.main.outputs.head || needs.plan.outputs.main }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          path: tools
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: needs.plan.outputs.rebase == 'true'
        with:
          name: replayed
          path: ${{ runner.temp }}/replayed
      - name: Fetch the replayed commits
        if: needs.plan.outputs.rebase == 'true'
        working-directory: tools
        run: |
          source notchcast/config.env
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the main job reported no replayed commit"; exit 1; }
          git fetch -q "https://github.com/$UPSTREAM_REPO.git" "$UP"
          git fetch -q "$RUNNER_TEMP/replayed/replayed.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$HEAD_SHA" \
            || { echo "::error::the replayed bundle is not the commit the main job reported"; exit 1; }
      # A review of U that is no longer a success (plan read it up to two hours ago) ends the run, nothing pushed.
      - name: Re-read the upstream review
        id: review
        if: needs.plan.outputs.rebase == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! python3 tools/notchcast/ci.py reviewed "$UP"; then
            echo "::notice::main stays: the review of upstream ${UP:0:7} is no longer a success"
            echo "lost=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: ./tools/notchcast/actions/deploy-key
        if: needs.plan.outputs.rebase == 'true' && steps.review.outputs.lost != 'true'
        with:
          key: ${{ secrets.DEPLOY_KEY }}
      # main moves onto reviewed upstream by a plain push of the sync merge: never a force-push (ci.py forward refuses
      # one). A landing that moved main since plan makes the push non-fast-forward: no failure; its push starts the
      # next Sync.
      - name: Update main
        id: update
        if: needs.plan.outputs.rebase == 'true' && steps.review.outputs.lost != 'true'
        working-directory: tools
        run: |
          python3 notchcast/ci.py forward "$OLD" "$HEAD_SHA"
          if ! git -c core.hooksPath=/dev/null push "$FORK_SSH" "$HEAD_SHA:refs/heads/main"; then
            NOW="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
            [ -n "$NOW" ] && [ "$NOW" != "$OLD" ] || exit 1
            if [ "$NOW" != "$HEAD_SHA" ]; then # else our push landed despite the error
              echo "::notice::main moved to ${NOW:0:7} during the replay; the next Sync replays onto it"
              echo "lost=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Drop the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key"
      - name: Mark the commit tested
        if: steps.review.outputs.lost != 'true' && steps.update.outputs.lost != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/notchcast/config.env
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=success -f context="$TESTED_CONTEXT" \
            -f description="Debug build and upstream tests green" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Close resolved issues
        if: steps.review.outputs.lost != 'true' && steps.update.outputs.lost != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$REBASE" != true ] || python3 tools/notchcast/ci.py issue close sync
          python3 tools/notchcast/ci.py issue close main
      # A failure here loses this sync's notice (main has already moved), so it never fails the run.
      - name: Upstream design-system changes
        if: needs.plan.outputs.rebase == 'true' && steps.review.outputs.lost != 'true' && steps.update.outputs.lost != 'true'
        continue-on-error: true
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 notchcast/ci.py design-notice . "${{ needs.plan.outputs.base }}" "$UP"

  # A red build, test or push: remember the input (refs/notchcast-failed/) and report it. Runs none of the tree's code.
  failed:
    needs: [plan, main, push]
    if: always() && needs.plan.result == 'success' && (needs.main.result == 'failure' || needs.push.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sync
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.main }}
          path: tools
          persist-credentials: false
      - name: Did main move under us?
        id: raced
        if: needs.plan.outputs.rebase == 'true'
        run: |
          NOW="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          echo "moved=$([ "$NOW" != "${{ needs.plan.outputs.main }}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Remember the failure
        if: needs.plan.outputs.rebase != 'true' || steps.raced.outputs.moved == 'false'
        uses: ./tools/notchcast/actions/remember-failure
        with:
          key: ${{ needs.plan.outputs.rebase == 'true' && needs.plan.outputs.main_key || format('test-{0}', needs.plan.outputs.main) }}
          deploy-key: ${{ secrets.DEPLOY_KEY }}
      - name: Drop the deploy key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key"
      - name: Report the failure
        if: needs.plan.outputs.rebase != 'true' || steps.raced.outputs.moved == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ needs.plan.outputs.main }}
          UP: ${{ needs.plan.outputs.upstream_main }}
          REBASE: ${{ needs.plan.outputs.rebase }}
        run: |
          if [ "$REBASE" = true ]; then
            python3 tools/notchcast/ci.py issue open sync "Sync failed: upstream ${UP:0:7} + main ${MAIN:0:7}" "build or tests red with main $MAIN"
          else
            python3 tools/notchcast/ci.py issue open main "main ${MAIN:0:7} fails its build or tests" "test-$MAIN"
          fi

  # One upstream release per call (sync-release.yml): build without secrets, sign, publish.
  release:
    needs: [plan, main, push]
    # After main: a release is built from the main this run ends with. Skipped main (nothing to rebase) is fine;
    # a lost main lease is not (main moved past plan's main), so the next Sync builds it.
    if: >-
      always() && needs.plan.result == 'success' && needs.main.result != 'failure' && needs.push.result != 'failure'
      && needs.push.outputs.lost != 'true' && needs.plan.outputs.releases != '[]'
    permissions:
      contents: write
      statuses: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        release: ${{ fromJSON(needs.plan.outputs.releases) }}
    uses: ./.github/workflows/sync-release.yml
    with:
      tag: ${{ matrix.release.tag }}
      commit: ${{ matrix.release.commit }}
      title: ${{ matrix.release.title }}
      prerelease: ${{ matrix.release.prerelease }}
      main: ${{ needs.plan.outputs.main }}
      base: ${{ needs.plan.outputs.base }}
    secrets: inherit
