name: Main harnesses

# Dispatch only: a ready PR gets its harnesses from the PR workflow, never twice.
on:
  workflow_dispatch:
    inputs:
      all:
        description: Run every harness, not only the ones the branch changed (load test)
        type: boolean
        default: false
      shards:
        description: Shards for an all run, 1 to 9
        type: number
        default: 4

permissions:
  contents: read

# One run per branch: a newer dispatch replaces the older run, which notchcast-ci.py reports as NOPROOF.
concurrency:
  group: main-harnesses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # On Linux, so a macOS runner is spent only on shards that have harnesses to run.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tests: ${{ steps.shards.outputs.tests }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changed harnesses
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.all) }}
        run: |
          git fetch -q origin '+refs/notchcast/synced/*:refs/notchcast/synced/*'
          BEFORE=$(bash notchcast/fork-point.sh origin/main HEAD)
          if python3 notchcast/lanes.py "$BEFORE" "$GITHUB_SHA" | grep -qx build=false; then
            echo "no Xcode lane: the branch changes only docs or scripts the build never reaches (notchcast/lanes.py)"
            : > "$RUNNER_TEMP/selected"
          else
            ./notchcast/changed-harnesses.sh "$BEFORE" "$GITHUB_SHA" > "$RUNNER_TEMP/selected"
          fi
          cat "$RUNNER_TEMP/selected"
      # About 40 harnesses compile in the time one more runner takes to start; at most 3 run beside a PR's checks job.
      # An all run has no selection: an empty tests output runs the whole suite, split by name over the shards.
      - name: Shards
        id: shards
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          REQUESTED: ${{ inputs.shards }}
        run: |
          if [ "$ALL" = true ]; then
            case "$REQUESTED" in [1-9]) shards=$REQUESTED ;; *) echo "::error::shards must be 1 to 9, not '$REQUESTED'"; exit 1 ;; esac
            tests=
            echo "all harnesses in $shards shard(s)"
          else
            count=$(grep -c . "$RUNNER_TEMP/selected" || true)
            shards=$(( (count + 39) / 40 ))
            [ "$shards" -le 3 ] || shards=3
            tests=$(tr '\n' ' ' < "$RUNNER_TEMP/selected")
            echo "$count harnesses in $shards shard(s)"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 0 $((shards - 1)))]" >> "$GITHUB_OUTPUT"
  harnesses:
    needs: plan
    # An empty selection skips this job and the run still concludes success; an empty matrix would fail it.
    if: ${{ needs.plan.outputs.shards != '[]' }}
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      NC_AUDIT_RENDERS: ${{ runner.temp }}/renders
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - name: Run harnesses, retry failures alone
        uses: ./tools/notchcast/actions/tests
        with:
          only: ${{ needs.plan.outputs.tests }}
          shard: ${{ matrix.shard }} ${{ strategy.job-total }}
          cache: push-${{ matrix.shard }}of${{ strategy.job-total }}
      # TEMP (#960, reverted before the PR): the audit renders in Frosted, and both looks as an artifact.
      - name: TEMP Frosted renders
        if: ${{ !cancelled() }}
        working-directory: src
        env:
          NOTCHCAST_ONLY_TESTS: nc-Notchcast-island-audit-render-test
          NC_AUDIT_LOOK: frosted
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: '1'
        run: bash ../tools/notchcast/ci-tests.sh
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: renders-${{ matrix.shard }}
          path: ${{ runner.temp }}/renders/960-*
          if-no-files-found: ignore
          retention-days: 3
  # TEMP (#960, reverted before the PR): the Debug build and lint a draft PR never gets.
  tempbuild:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Shared PR build lane
        working-directory: src
        env:
          NOTCHCAST_HARNESSES_SHARDED: '1'
        run: bash ../tools/notchcast/ci-build.sh
