# Advanced setup: default setup scans every PR; this runs on main pushes, weekly and on dispatch.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, ruby]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # The Raycast runtime is most of the repo's JS and only hidden Extensions load it (notchcast/docs/hidden.md).
          config: |
            paths-ignore:
              - Scripts/raycast-runtime
              - Tinycast/Resources/RaycastRuntime.generated.js
              - Tests/ext-fixtures
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
