name: Proof
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks:
        description: Space-separated checks, or all
        default: all
      base:
        description: Base commit to plan against, as a PR's base (notchcast/train.sh); overrides checks
        default: ''
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.event.pull_request.head.label || format('{0}:{1}', github.repository_owner, github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
          CHECKS: ${{ inputs.checks || 'all' }}
        run: |
          set -o pipefail
          if [ -n "$BASE" ]; then
            checks=$(python3 notchcast/app-proof.py plan "$BASE" HEAD | paste -sd ' ' -)
          elif [ "$CHECKS" = all ]; then
            checks=$(python3 -c 'import json; print(" ".join(json.load(open("notchcast/app-proofs.json"))))')
          else
            checks=$CHECKS
          fi
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
  proof:
    needs: plan
    if: needs.plan.outputs.checks != ''
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./notchcast/actions/xcode
      - uses: ./notchcast/actions/xcodegen
      - name: Regenerate project
        run: '"$XCODEGEN" generate --quiet'
      - name: Run Release app proofs
        env:
          CHECKS: ${{ needs.plan.outputs.checks }}
        run: python3 notchcast/app-proof.py run $CHECKS
