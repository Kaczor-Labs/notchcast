# UI mistakes our commits add to the SwiftUI code (enmerasoftware/ai-design-check, see notchcast/design-check.sh).
name: Design

on:
  push:
    branches: [main]
    paths: ["**/*.swift", "notchcast/design-check.sh", "notchcast/config.env", "notchcast/fetch-upstream.sh", ".github/workflows/design.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.swift", "notchcast/design-check.sh", "notchcast/config.env", "notchcast/fetch-upstream.sh", ".github/workflows/design.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Findings upstream already has are the baseline; only what our commits add is reported.
      - name: ai-design-check on our changes
        run: |
          bash notchcast/fetch-upstream.sh
          notchcast/design-check.sh "$(git merge-base HEAD refs/remotes/upstream/main)"
