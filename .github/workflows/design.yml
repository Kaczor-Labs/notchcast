# UI mistakes our commits add to the SwiftUI code (enmerasoftware/ai-design-check, see notchcast/design-check.sh).
name: Design

on:
  push:
    branches: [main]
    paths: ["**/*.swift", "notchcast/design-check.sh", "notchcast/config.env", "notchcast/fetch-upstream.sh", ".github/workflows/design.yml", ".github/actions/linux-node/action.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.swift", "notchcast/design-check.sh", "notchcast/config.env", "notchcast/fetch-upstream.sh", ".github/workflows/design.yml", ".github/actions/linux-node/action.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.event.pull_request.head.label || format('{0}:{1}', github.repository_owner, github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/linux-node
        with:
          version: '22.23.5'
          sha256: cdeb8670a0c81f51b4dc4ac61919f9b1ad917b304bf8221eb939570663d240f8
      # Findings upstream already has are the baseline; only what our commits add is reported.
      - name: ai-design-check on our changes
        run: |
          bash notchcast/fetch-upstream.sh
          notchcast/design-check.sh "$(git merge-base HEAD refs/remotes/upstream/main)"
