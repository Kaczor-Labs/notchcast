# UI mistakes our commits add to the SwiftUI code (enmerasoftware/ai-design-check, see notchcast/design-check.sh).
name: Design

on:
  push:
    branches: [main]
    paths: ["**/*.swift", "notchcast/design-check.sh", "notchcast/config.env", "notchcast/fetch-upstream.sh", ".github/workflows/design.yml"]
  pull_request:
    branches: [main]
    paths: ["**/*.swift", "notchcast/design-check.sh", "notchcast/config.env", "notchcast/fetch-upstream.sh", ".github/workflows/design.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.event.pull_request.head.label || format('{0}:{1}', github.repository_owner, github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Findings upstream already has are the baseline; only what our commits add is reported.
      - name: ai-design-check on our changes
        run: |
          bash notchcast/fetch-upstream.sh
          notchcast/design-check.sh "$(git merge-base HEAD refs/remotes/upstream/main)"
  # TEMPORARY (#1032 proof, removed before review): Linux regenerates main's generated files byte for byte.
  xcodegen-linux-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: c0d518039
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcodegen
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - working-directory: src
        run: |
          swift --version
          "$XCODEGEN" --version
          bash notchcast/fetch-upstream.sh
          python3 notchcast/ci.py regenerate . "$(git merge-base HEAD refs/remotes/upstream/main)"
          git status --porcelain
          (cd Scripts/raycast-runtime && npm ci --no-audit --no-fund && node build.mjs)
          git status --porcelain
          git diff --stat
          test -z "$(git status --porcelain)"
