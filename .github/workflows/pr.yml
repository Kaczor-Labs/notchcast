# Build and run upstream's harnesses on every PR to main, the same way Sync tests main. Nothing is pushed.
name: PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      base:
        description: Base commit the checks compare against, as a PR's base (notchcast/train.sh)
        default: ''

permissions:
  contents: read

# shadow: plan a harness selection and report failures outside it; shards still run every harness.
env:
  NOTCHCAST_HARNESS_SELECT: shadow

# One group per workflow and PR head: a dispatch and a pull_request run on one head never both run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || github.event.pull_request.head.label || format('{0}:{1}', github.repository_owner, github.ref_name) }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  # On Linux: a runner for checks (slot 0), each shard and the script tests (slot 4), hosted first, then the maintainer Mac pool (notchcast/runner/route.py).
  # It also names the lanes the diff needs (notchcast/lanes.py): a skipped one still reports, and build accepts it.
  route:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runners: ${{ steps.route.outputs.runners }}
      build: ${{ steps.lanes.outputs.build }}
      scripts: ${{ steps.lanes.outputs.scripts }}
      harness-planned: ${{ steps.select.outputs.planned }}
      harness-selected: ${{ steps.select.outputs.selected }}
      harness-unsure: ${{ steps.select.outputs.unsure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: notchcast
          fetch-depth: 0
          persist-credentials: false
      - name: Lanes the diff needs
        id: lanes
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        shell: bash
        run: |
          case "$GITHUB_HEAD_REF" in
            v2/addons-*) printf 'build=true\nscripts=true\n' | tee -a "$GITHUB_OUTPUT" ;;
            *) python3 notchcast/lanes.py "${BASE:-$(git merge-base origin/main HEAD)}" HEAD | tee -a "$GITHUB_OUTPUT" ;;
          esac
      # Never fails the run: with no plan the shards report their failures unjudged.
      - name: Harnesses the diff needs
        id: select
        if: steps.lanes.outputs.build == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        shell: bash
        run: |
          git sparse-checkout disable
          python3 notchcast/harness-select.py plan "${BASE:-$(git merge-base origin/main HEAD)}" HEAD
      - id: route
        uses: ./notchcast/actions/route
        with:
          count: 5
          idle: |
            ${{ vars.NOTCHCAST_IDLE_MBA }}
  checks:
    needs: route
    if: needs.route.outputs.build == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runners)[0] }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - name: Shared PR build lane
        working-directory: src
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NOTCHCAST_HARNESSES_SHARDED: '1'
        run: bash ../tools/notchcast/ci-build.sh
  # The whole suite, split by harness name (notchcast/test-harnesses.sh), beside the checks job.
  harnesses:
    needs: route
    if: needs.route.outputs.build == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runners)[matrix.slot] }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {shard: 0, slot: 1}
          - {shard: 1, slot: 2}
          - {shard: 2, slot: 3}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: src
          fetch-depth: 0
          persist-credentials: false
      - uses: ./tools/notchcast/actions/xcode
      - id: tests
        uses: ./tools/notchcast/actions/tests
        with:
          shard: ${{ matrix.shard }} ${{ strategy.job-total }}
          cache: pr-${{ matrix.shard }}of${{ strategy.job-total }}
      - name: Failures outside the harness selection
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          HARNESS_PLANNED: ${{ needs.route.outputs.harness-planned }}
          HARNESS_SELECTED: ${{ needs.route.outputs.harness-selected }}
          HARNESS_UNSURE: ${{ needs.route.outputs.harness-unsure }}
          HARNESS_TESTS: ${{ steps.tests.outcome }}
          SHARD: ${{ matrix.shard }}
        run: python3 tools/notchcast/harness-select.py misses "$RUNNER_TEMP/harness-failures" "$SHARD"
  # On macOS like the tools they test (BSD sed and date, swift, xcrun), in parallel (notchcast/script-tests.py).
  script-tests:
    needs: route
    if: needs.route.outputs.scripts == 'true'
    runs-on: ${{ fromJSON(needs.route.outputs.runners)[needs.route.outputs.build == 'true' && 4 || 0] }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./notchcast/actions/xcode
      # land-test.sh serves this checkout's upstream main to its fixture remote.
      - name: Fetch upstream
        run: bash notchcast/fetch-upstream.sh --no-tags
      - name: Script tests
        run: python3 notchcast/script-tests.py --all
  # land.sh reads the check named build: green only when every lane the diff needs is.
  build:
    needs: [route, checks, harnesses, script-tests]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A train run names its base
        if: startsWith(github.ref, 'refs/heads/train/') && inputs.base == ''
        run: |
          echo "::error::train branches are dispatched by notchcast/train.sh with -f base=<main sha>"
          exit 1
      - name: Every lane the diff needs passed, and only those were skipped
        env:
          ROUTE: ${{ needs.route.result }}
          BUILD: ${{ needs.route.outputs.build }}
          SCRIPTS: ${{ needs.route.outputs.scripts }}
          CHECKS: ${{ needs.checks.result }}
          HARNESSES: ${{ needs.harnesses.result }}
          SCRIPT_TESTS: ${{ needs.script-tests.result }}
        run: |
          case "$BUILD:$SCRIPTS" in true:true|false:true|false:false) ;; *) echo "::error::lanes said '$BUILD' '$SCRIPTS'"; exit 1;; esac
          want() { if [ "$1" = true ]; then echo success; else echo skipped; fi; }
          if [ "$ROUTE" != success ] || [ "$CHECKS" != "$(want "$BUILD")" ] || [ "$HARNESSES" != "$(want "$BUILD")" ] \
              || [ "$SCRIPT_TESTS" != "$(want "$SCRIPTS")" ]; then
            echo "::error::route: $ROUTE (build $BUILD, scripts $SCRIPTS), checks: $CHECKS, harnesses: $HARNESSES, script tests: $SCRIPT_TESTS"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # check-config reads every notchcast/ file, docs too; the checks job runs it when the build lane does.
      - name: Config literals
        if: needs.route.outputs.build != 'true'
        run: python3 notchcast/check-config.py
      # Only after a green build: Sync's plan skips testing a tree (GENERATED aside) a PR build already proved.
      - name: Record the tested tree
        if: needs.route.outputs.build == 'true'
        id: tree
        run: |
          echo "key=$(python3 notchcast/ci.py tested-key HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/tested-commit"
      - uses: actions/upload-artifact@v7
        if: needs.route.outputs.build == 'true'
        with:
          name: tested-tree-${{ steps.tree.outputs.key }}
          path: ${{ runner.temp }}/tested-commit
          if-no-files-found: error
          overwrite: true
          retention-days: 7
