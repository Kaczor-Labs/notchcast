name: Build release
description: >-
  Build, check, launch and pack an ad-hoc signed Release arm64 app from src into $RUNNER_TEMP/unsigned/<APP_NAME>.zip.
  Runs in a job without secrets; notchcast/actions/sign signs the result in a job that runs none of the tree's code.
inputs:
  version:
    description: Marketing version
    required: true
  build:
    description: Build number
    required: true
runs:
  using: composite
  steps:
    - name: Build (Release, ad-hoc signed, arm64)
      shell: bash -e {0}
      working-directory: src
      env:
        VERSION: ${{ inputs.version }}
        BUILD: ${{ inputs.build }}
      run: |
        set -a; source ../tools/notchcast/config.env; set +a
        xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
          -derivedDataPath "$RUNNER_TEMP/DerivedData" \
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
          OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
          MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" \
          build -quiet
    - name: Verify the app
      shell: bash -e {0}
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -a; source tools/notchcast/config.env; set +a
        NAME="$APP_NAME"
        APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/$NAME.app"
        bash tools/notchcast/verify-signature.sh "$APP" ./src/Scripts/verify-signature.sh
        codesign --verify --deep --strict "$APP"
        plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$APP/Contents/Info.plist"; }
        test "$(plist CFBundleIdentifier)" = "$BUNDLE_ID"
        test "$(plist CFBundleShortVersionString)" = "$VERSION"
        for BIN in "$APP/Contents/MacOS/$NAME" "$APP/Contents/Helpers/ClipboardTextHelper" "$APP/Contents/Helpers/FileIndexHelper"; do
          test "$(lipo -archs "$BIN")" = arm64
        done
    - name: Check app identity
      shell: bash -e {0}
      run: |
        source tools/notchcast/config.env
        ./tools/notchcast/check-identity.sh app "$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app"
    - name: Launch and stay alive
      shell: bash -e {0}
      run: |
        source tools/notchcast/config.env
        mkdir -p "$RUNNER_TEMP/launch"
        ditto "$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app" "$RUNNER_TEMP/launch/$APP_NAME.app"
        "$RUNNER_TEMP/launch/$APP_NAME.app/Contents/MacOS/$APP_NAME" &
        PID=$!
        trap 'kill "$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true' EXIT
        sleep 30
        kill -0 "$PID" || { echo '::error::Release skipped: app did not stay alive'; exit 1; }
    - name: Pack the app for the sign job
      shell: bash -e {0}
      run: |
        source tools/notchcast/config.env
        mkdir -p "$RUNNER_TEMP/unsigned"
        ditto -c -k --keepParent --sequesterRsrc "$RUNNER_TEMP/DerivedData/Build/Products/Release/$APP_NAME.app" \
          "$RUNNER_TEMP/unsigned/$APP_NAME.zip"
